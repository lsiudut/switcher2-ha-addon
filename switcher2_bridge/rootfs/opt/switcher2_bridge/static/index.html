<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modbus Bridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    html { scroll-behavior: smooth; }
    body { font-size: 15px; }
    button, input, select { transition: border-color 120ms, box-shadow 120ms, background-color 120ms; }
    input:not([type="checkbox"]):not([type="range"]):not([type="file"]):focus,
    select:focus {
      border-color: rgb(14 165 233) !important;
      box-shadow: 0 0 0 3px rgb(14 165 233 / 0.15);
      outline: none;
    }
    input[type="checkbox"] { accent-color: rgb(2 132 199); height: 1rem; width: 1rem; }
    input[type="range"] { accent-color: rgb(2 132 199); }
    summary { list-style: none; }
    summary::-webkit-details-marker { display: none; }
    details[open] .details-chevron { transform: rotate(90deg); }
    .details-chevron { transition: transform 150ms ease; }
  </style>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900" x-data="app()" x-init="init()" x-cloak>
  <header class="sticky top-0 z-30 bg-slate-950 text-white shadow">
    <div class="mx-auto flex h-14 max-w-[1600px] items-center justify-between px-4 sm:px-6">
      <div class="flex items-center gap-3">
        <div class="h-2.5 w-2.5 rounded-full" :class="overallOnline() ? 'bg-emerald-400' : 'bg-rose-500'"></div>
        <span class="font-semibold">Modbus Bridge</span>
      </div>
      <div class="text-xs text-slate-300">
        <span x-text="devices.length"></span>
        <span x-text="devices.length === 1 ? 'device' : 'devices'"></span>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1600px] px-4 py-4 sm:px-6">
    <div class="mb-3 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-semibold text-slate-800">Devices</h1>
        <p class="text-sm text-slate-500">Live status and setup for connected controllers.</p>
      </div>
      <button
        @click="refreshAll()"
        class="rounded-md bg-slate-800 px-3 py-2 text-sm font-medium text-white hover:bg-slate-700">
        Refresh
      </button>
    </div>

    <div x-show="loading" class="rounded-md border border-slate-200 bg-white p-6 text-sm text-slate-500">
      Loading devices...
    </div>

    <div x-show="!loading && devices.length === 0" class="rounded-md border border-slate-200 bg-white p-6 text-sm text-slate-500">
      No devices are configured.
    </div>

    <div class="space-y-5">
      <template x-for="device in devices" :key="device.id">
        <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
          <div class="flex flex-wrap items-start justify-between gap-3 border-b border-slate-200 px-4 py-3">
            <div>
              <div class="flex items-center gap-2">
                <h2 class="text-lg font-semibold text-slate-800" x-text="device.name"></h2>
                <span
                  class="rounded px-2 py-0.5 text-xs font-medium"
                  :class="device.available ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'"
                  x-text="device.available ? 'Online' : 'Offline'"></span>
              </div>
              <div class="mt-0.5 text-xs text-slate-500">
                <span x-text="deviceTypeLabel(device)"></span>
                <span class="mx-1">·</span>
                <span x-text="device.id"></span>
              </div>
            </div>
            <button
              @click="refreshDevice(device)"
              class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">
              Refresh
            </button>
          </div>

          <div class="p-4">
            <template x-if="device.web_ui === 'power_meter'">
              <div>
                <div x-show="!readings[device.id]" class="text-sm text-slate-500">
                  Loading readings...
                </div>

                <div x-show="readings[device.id]?.error" class="rounded-md border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">
                  <span x-text="readings[device.id]?.error"></span>
                </div>

                <div x-show="readings[device.id] && !readings[device.id]?.error">
                  <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-5">
                    <template x-for="reading in readings[device.id]?.readings ?? []" :key="reading.key">
                      <div class="rounded-md border border-slate-200 p-3">
                        <div class="truncate text-xs font-medium text-slate-500" x-text="reading.description"></div>
                        <div class="mt-2 flex items-baseline gap-1">
                          <span class="text-xl font-semibold tabular-nums text-slate-900" x-text="formatReading(reading)"></span>
                          <span class="text-xs text-slate-500" x-text="reading.unit"></span>
                        </div>
                        <div class="mt-1 text-xs text-slate-400" x-text="reading.parameter"></div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>

            <template x-if="device.web_ui === 'rolettini'">
              <div>
                <div x-show="!rolettini[device.id]" class="text-sm text-slate-500">
                  Loading blind state...
                </div>

                <div x-show="rolettini[device.id]?.error" class="rounded-md border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">
                  <span x-text="rolettini[device.id]?.error"></span>
                </div>

                <div x-show="rolettini[device.id] && !rolettini[device.id]?.error" class="space-y-5">
                  <div class="grid gap-3 md:grid-cols-2 xl:grid-cols-4">
                    <div class="rounded-md border border-slate-200 p-3">
                      <div class="text-xs font-medium text-slate-500">Position</div>
                      <div class="mt-1 text-2xl font-semibold tabular-nums" x-text="valueWithUnit(rolettini[device.id]?.status?.position, '%')"></div>
                    </div>
                    <div class="rounded-md border border-slate-200 p-3">
                      <div class="text-xs font-medium text-slate-500">System</div>
                      <div class="mt-1 font-semibold" x-text="rolettini[device.id]?.status?.system_state ?? '-'"></div>
                    </div>
                    <div class="rounded-md border border-slate-200 p-3">
                      <div class="text-xs font-medium text-slate-500">Relay</div>
                      <div class="mt-1 font-semibold" x-text="rolettini[device.id]?.status?.relay_state ?? '-'"></div>
                    </div>
                    <div class="rounded-md border border-slate-200 p-3">
                      <div class="text-xs font-medium text-slate-500">Config</div>
                      <div class="mt-1 font-semibold" :class="rolettini[device.id]?.status?.config_modified ? 'text-amber-700' : 'text-emerald-700'" x-text="rolettini[device.id]?.status?.config_modified ? 'Unsaved' : 'Saved'"></div>
                    </div>
                  </div>

                  <div x-show="(rolettini[device.id]?.status?.alerts ?? []).length" class="rounded-md border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800">
                    Alerts:
                    <span x-text="(rolettini[device.id]?.status?.alerts ?? []).join(', ')"></span>
                  </div>

                  <div class="rounded-md border border-slate-200 p-4">
                    <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                      <h3 class="font-semibold text-slate-800">Movement</h3>
                      <div class="flex flex-wrap gap-2">
                        <button @click="rolettiniCommand(device, 'stop')" class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Stop</button>
                        <button @click="rolettiniCommand(device, 'emergency_stop', null, true)" class="rounded bg-rose-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-rose-500">Emergency Stop</button>
                      </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-3">
                      <input type="range" min="0" max="100" x-model.number="positionDraft[device.id]" @input="markPositionDirty(device.id)" class="w-64 max-w-full">
                      <input type="number" min="0" max="100" x-model.number="positionDraft[device.id]" @input="markPositionDirty(device.id)" class="w-24 rounded border border-slate-300 px-2 py-1.5 text-sm">
                      <button @click="rolettiniCommand(device, 'set_position', positionDraft[device.id])" class="rounded bg-slate-800 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700">Set Position</button>
                    </div>
                  </div>

                  <div class="grid gap-5 xl:grid-cols-2">
                    <div class="rounded-md border border-slate-200 p-4">
                      <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                        <div>
                          <h3 class="font-semibold text-slate-800">Configuration</h3>
                          <p x-show="rolettini[device.id]?.status?.config_modified" class="mt-1 text-xs text-amber-700">Save to flash if these changes should persist after reboot.</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                          <button @click="saveRolettiniConfig(device)" class="rounded bg-slate-800 px-3 py-1.5 text-sm font-medium text-white hover:bg-slate-700">Apply</button>
                          <button @click="rolettiniCommand(device, 'save_config', null, true)" class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Save to Flash</button>
                        </div>
                      </div>
                      <div class="grid gap-3 sm:grid-cols-2">
                        <template x-for="field in rolettini[device.id]?.config ?? []" :key="field.symbol">
                          <label class="block">
                            <span class="mb-1 block text-xs font-medium text-slate-500" x-text="field.name"></span>
                            <div class="flex items-center gap-2">
                              <input
                                type="number"
                                :min="field.min"
                                :max="field.max"
                                :step="inputStep(field)"
                                x-model="configDraft[device.id][field.symbol]"
                                class="w-full rounded border border-slate-300 px-2 py-1.5 text-sm">
                              <span class="w-10 shrink-0 text-xs text-slate-500" x-text="field.unit"></span>
                            </div>
                          </label>
                        </template>
                      </div>
                    </div>

                    <div class="space-y-5">
                      <div class="rounded-md border border-slate-200 p-4">
                        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                          <h3 class="font-semibold text-slate-800">Calibration</h3>
                          <span class="text-sm" :class="rolettini[device.id]?.status?.calibrated ? 'text-emerald-700' : 'text-amber-700'" x-text="rolettini[device.id]?.status?.calibrated ? 'Calibrated' : 'Not calibrated'"></span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                          <button @click="rolettiniCommand(device, 'top_bottom_calibration', null, true)" class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Top/Bottom</button>
                          <button @click="rolettiniCommand(device, 'current_position_calibration', null, true)" class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Current Position</button>
                          <button @click="rolettiniCommand(device, 'clear_alerts', null, true)" class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Clear Alerts</button>
                          <button @click="rolettiniCommand(device, 'clear_emergency', null, true)" class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Clear Emergency</button>
                        </div>
                        <div class="mt-3 grid grid-cols-2 gap-3 text-sm">
                          <div><span class="text-slate-500">Up time:</span> <span x-text="valueWithUnit(rolettini[device.id]?.derived?.cal_up_time_ms, 'ms')"></span></div>
                          <div><span class="text-slate-500">Down time:</span> <span x-text="valueWithUnit(rolettini[device.id]?.derived?.cal_down_time_ms, 'ms')"></span></div>
                        </div>
                      </div>

                      <div class="rounded-md border border-slate-200 p-4">
                        <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                          <h3 class="font-semibold text-slate-800">System Actions</h3>
                          <button @click="rolettiniCommand(device, 'reboot', null, true)" class="rounded border border-rose-300 px-3 py-1.5 text-sm font-medium text-rose-700 hover:bg-rose-50">Reboot</button>
                        </div>
                        <button @click="rolettiniCommand(device, 'reset_statistics', null, true)" class="rounded border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-50">Reset Statistics</button>
                      </div>
                    </div>
                  </div>

                  <div class="grid gap-5 xl:grid-cols-2">
                    <div class="rounded-md border border-slate-200 p-4">
                      <h3 class="mb-3 font-semibold text-slate-800">Diagnostics</h3>
                      <div class="grid gap-2 sm:grid-cols-2">
                        <template x-for="field in diagnosticFields(rolettini[device.id])" :key="field.symbol">
                          <div class="flex justify-between gap-3 border-b border-slate-100 py-1 text-sm">
                            <span class="truncate text-slate-500" x-text="field.name"></span>
                            <span class="shrink-0 tabular-nums text-slate-800" x-text="formatField(field)"></span>
                          </div>
                        </template>
                      </div>
                    </div>
                    <div class="rounded-md border border-slate-200 p-4">
                      <h3 class="mb-3 font-semibold text-slate-800">Advanced</h3>
                      <div class="space-y-2">
                        <template x-for="field in rolettini[device.id]?.advanced ?? []" :key="field.symbol">
                          <div class="flex justify-between gap-3 border-b border-slate-100 py-1 text-sm">
                            <span class="text-slate-500" x-text="field.name"></span>
                            <span class="text-slate-800" x-text="formatField(field)"></span>
                          </div>
                        </template>
                        <div class="pt-2 text-sm text-slate-500">
                          Firmware <span x-text="rolettini[device.id]?.derived?.firmware_version ?? '-'"></span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </template>

            <template x-if="device.web_ui === 'switcher2'">
              <div>
                <div x-show="switcher.error" class="rounded-lg border border-rose-200 bg-rose-50 p-4 text-sm text-rose-700">
                  <strong>Cannot talk to the relay controller.</strong>
                  <span class="ml-1" x-text="switcher.error"></span>
                </div>

                <div x-show="!switcher.error" class="space-y-4">
                  <div class="flex flex-wrap items-center gap-x-5 gap-y-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2 text-sm">
                    <div class="flex items-center gap-2">
                      <span class="text-slate-500">Controller</span>
                      <strong x-text="switcher.status.fw_version ?? 'Unknown firmware'"></strong>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-slate-500">Configuration</span>
                      <strong :class="switcher.status.dirty ? 'text-amber-700' : 'text-emerald-700'"
                              x-text="switcher.status.dirty ? 'Not saved to memory' : 'Saved in memory'"></strong>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-slate-500">Connection</span>
                      <strong class="font-mono text-xs" x-text="serialConfigLabel()"></strong>
                    </div>
                    <div class="ml-auto flex flex-wrap gap-2">
                      <button @click="configCommand('/api/config/save', 'Configuration saved')"
                              class="rounded bg-sky-700 px-3 py-1.5 text-sm font-semibold text-white hover:bg-sky-600">
                        Save all to device memory
                      </button>
                      <button @click="discardSwitcherDrafts()"
                              class="rounded border border-slate-300 bg-white px-3 py-1.5 text-sm text-slate-700 hover:bg-slate-100">
                        Undo unsaved form edits
                      </button>
                    </div>
                  </div>

                  <div x-show="hasSwitcherDrafts()" class="rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-900">
                    Changes are being edited or applied. Choose <strong>Apply channel</strong>
                    or <strong>Save input</strong> to send form edits, then use
                    <strong>Save all to device memory</strong> to keep them after a restart.
                  </div>

                  <div class="grid gap-4 2xl:grid-cols-[minmax(0,3fr)_minmax(20rem,1fr)]">
                    <section class="rounded-xl border border-slate-200 bg-white p-4">
                      <div class="mb-3">
                        <h3 class="font-semibold text-slate-900">Outputs and channels</h3>
                        <p class="text-xs text-slate-500">Choose a channel below. Its controls and setup appear in the same panel.</p>
                      </div>

                      <label class="mb-4 block sm:hidden">
                        <span class="mb-1 block text-sm font-medium text-slate-700">Channel to view or edit</span>
                        <select x-model.number="selectedChannel" class="w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm">
                          <template x-for="channel in switcher.channels" :key="channel.ch">
                            <option :value="channel.ch" x-text="'CH ' + (channel.ch + 1) + ' · ' + channel.name + ' · ' + channelStatusLabel(channel)"></option>
                          </template>
                        </select>
                      </label>
                      <div class="mb-4 hidden gap-1.5 sm:grid sm:grid-cols-4 xl:grid-cols-7">
                        <template x-for="channel in switcher.channels" :key="channel.ch">
                          <button @click="selectedChannel = channel.ch" type="button"
                                  class="min-w-0 rounded-lg border px-2 py-2 text-left"
                                  :class="selectedChannel === channel.ch ? 'border-sky-500 bg-sky-50 ring-1 ring-sky-500' : 'border-slate-200 bg-white hover:border-slate-300 hover:bg-slate-50'">
                            <div class="flex items-center justify-between gap-1">
                              <span class="text-xs font-semibold text-slate-500" x-text="'CH ' + (channel.ch + 1)"></span>
                              <span class="h-2 w-2 rounded-full"
                                    :class="channel.status ? 'bg-emerald-500' : 'bg-slate-300'"></span>
                            </div>
                            <div class="truncate text-sm font-medium text-slate-800" x-text="channel.name"></div>
                            <div class="truncate text-[11px] text-slate-500" x-text="channelTypeLabel(channel) + ' · ' + channelStatusLabel(channel)"></div>
                          </button>
                        </template>
                      </div>

                      <template x-if="selectedChannelData()">
                        <div class="rounded-lg border border-slate-200 bg-slate-50/70 p-4">
                          <div class="mb-4 flex flex-wrap items-start justify-between gap-3">
                            <div>
                              <h4 class="font-semibold text-slate-900"
                                  x-text="'Channel ' + (selectedChannelData().ch + 1) + ': ' + selectedChannelData().name"></h4>
                              <p class="text-xs text-slate-500">Changes in this editor are not sent until you click Apply channel.</p>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                              <template x-if="Number(selectedChannelData().type) === 1">
                                <div class="flex gap-1.5">
                                  <button @click="channelCommand(selectedChannelData(), 'off')" class="rounded border border-slate-300 bg-white px-3 py-1.5 text-sm">Turn off</button>
                                  <button @click="channelCommand(selectedChannelData(), 'on')" class="rounded bg-sky-700 px-3 py-1.5 text-sm font-medium text-white">Turn on</button>
                                </div>
                              </template>
                              <template x-if="Number(selectedChannelData().type) === 2">
                                <div class="flex gap-1.5">
                                  <button @click="channelCommand(selectedChannelData(), 'pos=0')" class="rounded border border-slate-300 bg-white px-3 py-1.5 text-sm">Close</button>
                                  <button @click="channelCommand(selectedChannelData(), 'stop')" class="rounded border border-amber-300 bg-white px-3 py-1.5 text-sm text-amber-800">Stop</button>
                                  <button @click="channelCommand(selectedChannelData(), 'pos=10000')" class="rounded bg-sky-700 px-3 py-1.5 text-sm font-medium text-white">Open</button>
                                </div>
                              </template>
                            </div>
                          </div>

                          <div class="grid gap-3 md:grid-cols-2">
                            <label class="block">
                              <span class="mb-1 block text-sm font-medium text-slate-700">Name shown in Home Assistant</span>
                              <input x-model="selectedChannelData().name"
                                     @input="markChannelNameDirty(selectedChannelData().ch)"
                                     class="w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm"
                                     placeholder="For example: Kitchen ceiling">
                              <span class="mt-1 block text-xs text-slate-500">Use a name a person will recognize.</span>
                            </label>
                            <label class="block">
                              <span class="mb-1 block text-sm font-medium text-slate-700">What is connected?</span>
                              <select x-model.number="selectedChannelData().type"
                                      @change="markChannelDirty(selectedChannelData().ch)"
                                      class="w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm">
                                <option :value="0">Nothing / unused channel</option>
                                <option :value="1">Light or other on/off load</option>
                                <option :value="2">Motorized blind</option>
                              </select>
                              <span class="mt-1 block text-xs text-slate-500">This determines which controls and settings are available.</span>
                            </label>
                          </div>

                          <template x-if="Number(selectedChannelData().type) === 1">
                            <div class="mt-4 grid gap-4 lg:grid-cols-[minmax(0,2fr)_minmax(15rem,1fr)]">
                              <div>
                                <div class="text-sm font-medium text-slate-700">Physical relays used by this channel</div>
                                <p class="mb-2 text-xs text-slate-500">Select every relay that should switch together with this light.</p>
                                <div class="grid grid-cols-7 gap-1.5">
                                  <template x-for="relay in relayIndexes" :key="relay">
                                    <label class="flex cursor-pointer items-center justify-center gap-1 rounded border border-slate-200 bg-white px-1 py-2 text-xs hover:bg-slate-50">
                                      <input type="checkbox" :checked="relaySelected(selectedChannelData(), relay)"
                                             @change="setRelaySelected(selectedChannelData(), relay, $event.target.checked)">
                                      <span x-text="relay + 1"></span>
                                    </label>
                                  </template>
                                </div>
                              </div>
                              <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-1">
                                <label class="block">
                                  <span class="mb-1 block text-sm font-medium text-slate-700">Automatic turn-off</span>
                                  <div class="flex items-center gap-2">
                                    <input type="number" min="0" max="65535"
                                           x-model.number="selectedChannelData().light_off_delay_s"
                                           @input="markChannelDirty(selectedChannelData().ch)"
                                           class="w-full rounded border border-slate-300 bg-white px-3 py-2 text-sm">
                                    <span class="text-sm text-slate-500">seconds</span>
                                  </div>
                                  <span class="mt-1 block text-xs text-slate-500">Enter 0 to keep it on until another command.</span>
                                </label>
                                <label class="flex items-start gap-2 rounded border border-slate-200 bg-white p-2.5 text-sm">
                                  <input type="checkbox" x-model="selectedChannelData().light_default_on"
                                         @change="markChannelDirty(selectedChannelData().ch)" class="mt-0.5">
                                  <span><strong class="block font-medium">Turn on after startup</strong><span class="text-xs text-slate-500">Normally leave this off.</span></span>
                                </label>
                              </div>
                            </div>
                          </template>

                          <template x-if="Number(selectedChannelData().type) === 2">
                            <div class="mt-4 grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
                              <label class="block">

                              <span class="text-slate-400">ms</span>

                        <button @click="saveZcd()" class="mt-3 w-full rounded bg-slate-800 px-3 py-2 text-sm font-medium text-white">Apply zero-cross settings</button>
                      </div>

                      <div class="rounded-lg border border-slate-200 bg-white p-4">
                        <h4 class="font-semibold text-slate-800">Controller connection</h4>

                          <label class="block"><span class="mb-1 block text-xs font-medium text-slate-600">Connection speed (baud)</span><input type="number" x-model.number="switcher.serial.baud" @input="markSerialDirty()" class="w-full rounded border border-slate-300 px-2 py-1.5 text-sm"></label>

                          <div class="my-2 grid grid-cols-3 gap-2 text-xs"><div><span class="block text-slate-500">Active slot</span><strong x-text="switcher.ota.slot_label ?? '-'"></strong></div><div><span class="block text-slate-500">State</span><strong x-text="switcher.ota.phase ?? '-'"></strong></div><div><span class="block text-slate-500">Progress</span><strong x-text="Math.round((switcher.ota.progress ?? 0) * 100) + '%'"></strong></div></div>
                          <div x-show="switcher.ota.error" class="mb-2 rounded bg-rose-50 p-2 text-xs text-rose-700" x-text="switcher.ota.error"></div>
                          <label class="block"><span class="mb-1 block text-xs font-medium text-slate-600">Firmware image file</span><input type="file" @change="switcher.otaFile = $event.target.files[0]" class="w-full text-sm"></label>
                          <div class="mt-3 flex flex-wrap gap-2"><button @click="flashOta(false)" class="rounded bg-slate-800 px-3 py-1.5 text-sm font-medium text-white">Install normally</button><button @click="flashOta(true)" class="rounded border border-slate-300 px-3 py-1.5 text-sm">Install as test image</button><button @click="apiPost('/api/ota/trial', {}).then(() => toast('Trial boot started')).then(() => refreshSwitcher(true))" class="rounded border border-slate-300 px-3 py-1.5 text-sm">Start saved test image</button><button @click="apiPost('/api/ota/abort', {}).then(() => toast('OTA aborted')).then(() => refreshSwitcher(true))" class="rounded border border-rose-300 px-3 py-1.5 text-sm text-rose-700">Cancel update</button></div>
                        </div>
                        <div class="rounded-lg border border-rose-200 bg-rose-50 p-4">

                          <p class="mb-3 text-xs text-rose-700">These actions interrupt service or erase configuration. Use them only when necessary.</p>
                          <div class="flex flex-wrap gap-2"><button @click="configCommand('/api/config/discard', 'Discard changes made on the controller', true)" class="rounded border border-amber-300 bg-white px-3 py-1.5 text-sm text-amber-800">Reload saved device settings</button><button @click="rebootSwitcher()" class="rounded border border-rose-300 bg-white px-3 py-1.5 text-sm text-rose-700">Restart controller</button><button @click="configCommand('/api/config/reset', 'Factory-reset the controller', true)" class="rounded bg-rose-700 px-3 py-1.5 text-sm font-medium text-white">Erase configuration</button></div>

  <div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
    <template x-for="toast in toasts" :key="toast.id">
      <div
        x-transition
        class="rounded-md px-4 py-3 text-sm text-white shadow-lg"
        :class="toast.type === 'error' ? 'bg-rose-600' : 'bg-slate-800'"
        x-text="toast.message"></div>
    </template>
  </div>

  <script>
    function app() {
      return {
        loading: true,
        devices: [],
        readings: {},
        rolettini: {},
        configDraft: {},
        positionDraft: {},
        positionDirty: {},
        positionPending: {},
        switcher: {
          error: null,
          status: {},
          channels: [],
          actions: Array.from({ length: 16 }, () => Array.from({ length: 4 }, () => ({ action: 0, channel: 0, param: 0 }))),
          debounce: Array.from({ length: 16 }, () => 0),
          zcd: {
            enabled: false,
            delays: Array.from({ length: 14 }, () => -1),
            pending: Array.from({ length: 14 }, () => 0),
            edge_count: 0,
            edge_age_ms: 65535,
            fallback_count: 0,
          },
          serial: {},
          ota: {},
          otaFile: null,
          channelNames: Array.from({ length: 14 }, (_, i) => `Channel ${i + 1}`),
          inputNames: Array.from({ length: 16 }, (_, i) => `Input ${i + 1}`),
        },
        selectedChannel: 0,
        selectedInput: 0,
        zcdDirty: false,
        zcdPendingConfig: null,
        switcherLoaded: false,
        switcherRefreshInFlight: false,
        dirty: {
          channels: {},
          channelNames: {},
          actions: {},
          inputNames: {},
          debounce: {},
          serial: false,
        },
        relayIndexes: Array.from({ length: 14 }, (_, i) => i),
        inputIndexes: Array.from({ length: 16 }, (_, i) => i),
        eventIndexes: Array.from({ length: 4 }, (_, i) => i),
        eventNames: ['Button pressed', 'Button released', 'Short press', 'Long press'],
        actionOptions: [
          { value: 0, label: 'Do nothing' },
          { value: 1, label: 'Toggle light on or off' },
          { value: 2, label: 'Turn light on' },
          { value: 3, label: 'Turn light off' },
          { value: 4, label: 'Move blind to a position' },
          { value: 5, label: 'Start opening blind' },
          { value: 6, label: 'Start closing blind' },
          { value: 7, label: 'Stop blind' },
        ],
        toasts: [],
        pollTimer: null,

        async init() {
          await this.refreshAll();
          this.pollTimer = setInterval(() => this.refreshReadingsOnly(), 2000);
        },

        overallOnline() {
          return this.devices.some(device => device.available);
        },

        hasSwitcherDrafts() {
          return this.zcdDirty || this.zcdPendingConfig !== null || this.dirty.serial ||
            Object.values(this.dirty.channels).some(Boolean) ||
            Object.values(this.dirty.channelNames).some(Boolean) ||
            Object.values(this.dirty.actions).some(Boolean) ||
            Object.values(this.dirty.inputNames).some(Boolean) ||
            Object.values(this.dirty.debounce).some(Boolean);
        },

        serialLabel(device) {
          const s = device.serial || {};
          return `${s.port ?? ''} ${s.baud ?? ''} ${s.bytesize ?? 8}${s.parity ?? 'E'}${s.stopbits ?? 1} slave ${s.slave_addr ?? s.slave ?? '?'}`;
        },

        deviceTypeLabel(device) {
          return {
            switcher2: 'Relay and blind controller',
            dds1946_power_meter: 'Electricity meter',
            rolettini_blinds: 'Blind controller',
          }[device.type] || device.type;
        },

        async refreshAll() {
          this.loading = true;
          try {
            this.devices = await this.apiGet('/api/devices');
            await this.refreshReadingsOnly();
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          } finally {
            this.loading = false;
          }
        },

        async refreshReadingsOnly() {
          await Promise.all(this.devices.map(device => this.refreshDevice(device, true)));
        },

        async refreshDevice(device, silent = false) {
          if (device.web_ui === 'switcher2') {
            await this.refreshSwitcher(silent);
            return;
          }
          if (device.web_ui === 'rolettini') {
            await this.refreshRolettini(device, silent);
            return;
          }
          if (device.web_ui !== 'power_meter') return;
          try {
            const data = await this.apiGet(`/api/devices/${encodeURIComponent(device.id)}/readings`);
            this.readings = { ...this.readings, [device.id]: data };
            device.available = data.available;
          } catch (error) {
            this.readings = { ...this.readings, [device.id]: { error: error.message || String(error) } };
            device.available = false;
            if (!silent) this.toast(error.message || String(error), 'error');
          }
        },

        async refreshSwitcher(silent = false) {
          if (this.switcherRefreshInFlight) return;
          this.switcherRefreshInFlight = true;
          try {
            const [status, channels, actions, debounce, zcd, serial, ota, names] = await Promise.all([
              this.apiGet('/api/status'),
              this.apiGet('/api/channels'),
              this.apiGet('/api/actions'),
              this.apiGet('/api/debounce'),
              this.apiGet('/api/zcd'),
              this.apiGet('/api/serial'),
              this.apiGet('/api/ota/status'),
              this.apiGet('/api/names'),
            ]);
            const normalizedChannels = this.normalizeChannels(channels);
            const normalizedActions = this.normalizeActions(actions);
            const normalizedZcd = this.normalizeZcd(zcd);
            const normalizedSerial = this.normalizeSerial(serial);
            const serverInputNames = names.input_names ?? [];
            this.switcher = {
              ...this.switcher,
              error: null,
              status,
              channels: this.mergeChannelRefresh(normalizedChannels),
              actions: this.mergeActionRefresh(normalizedActions),
              debounce: this.mergeArrayRefresh(debounce, this.switcher.debounce, this.dirty.debounce),
              zcd: this.mergeZcdRefresh(normalizedZcd),
              serial: this.mergeSerialRefresh(normalizedSerial),
              ota,
              channelNames: names.channel_names ?? [],
              inputNames: this.mergeArrayRefresh(serverInputNames, this.switcher.inputNames, this.dirty.inputNames),
            };
            this.switcherLoaded = true;
          } catch (error) {
            this.switcher = { ...this.switcher, error: error.message || String(error) };
            if (!silent) this.toast(error.message || String(error), 'error');
          } finally {
            this.switcherRefreshInFlight = false;
          }
        },

        normalizeChannels(channels) {
          return channels.map(channel => ({
            ...channel,
            type: Number(channel.type),
            relay_mask: Number(channel.relay_mask || 0),
            relay_a: Number(channel.relay_a || 0),
            relay_b: Number(channel.relay_b || 0),
            travel_ms_open: Number(channel.travel_ms_open || 0),
            travel_ms_close: Number(channel.travel_ms_close || 0),
            light_off_delay_s: Number(channel.light_off_delay_s || 0),
            light_default_on: Boolean(channel.light_default_on),
          }));
        },

        normalizeSerial(serial) {
          return {
            port: serial.port ?? '',
            baud: Number(serial.baud ?? serial.baudrate ?? 19200),
            slave_addr: Number(serial.slave_addr ?? serial.slave ?? 22),
            parity: serial.parity ?? 'E',
            bytesize: Number(serial.bytesize ?? 8),
            stopbits: Number(serial.stopbits ?? 1),
          };
        },

        mergeChannelRefresh(serverChannels) {
          if (!this.switcherLoaded) return serverChannels;
          const configFields = [
            'type', 'relay_mask', 'relay_a', 'relay_b', 'travel_ms_open',
            'travel_ms_close', 'light_off_delay_s', 'light_default_on',
          ];
          return serverChannels.map(serverChannel => {
            const ch = serverChannel.ch;
            const localChannel = this.switcher.channels.find(channel => channel.ch === ch);
            if (!localChannel) return serverChannel;
            const merged = { ...serverChannel };
            if (this.dirty.channels[ch]) {
              const serverMatches = configFields.every(field =>
                serverChannel[field] === localChannel[field]
              );
              if (serverMatches) {
                this.dirty.channels[ch] = false;
              } else {
                for (const field of configFields) merged[field] = localChannel[field];
              }
            }
            if (this.dirty.channelNames[ch]) merged.name = localChannel.name;
            return merged;
          });
        },

        mergeActionRefresh(serverActions) {
          if (!this.switcherLoaded) return serverActions;
          return serverActions.map((row, input) => row.map((serverAction, event) => {
            const key = `${input}:${event}`;
            if (!this.dirty.actions[key]) return serverAction;
            const localAction = this.switcher.actions[input][event];
            const serverMatches = ['action', 'channel', 'param'].every(field =>
              Number(serverAction[field]) === Number(localAction[field])
            );
            if (serverMatches) {
              this.dirty.actions[key] = false;
              return serverAction;
            }
            return { ...localAction };
          }));
        },

        mergeArrayRefresh(serverValues, localValues, dirtyValues) {
          if (!this.switcherLoaded) return serverValues;
          return serverValues.map((value, index) => {
            if (!dirtyValues[index]) return value;
            if (value === localValues[index]) {
              dirtyValues[index] = false;
              return value;
            }
            return localValues[index];
          });
        },

        mergeSerialRefresh(serverSerial) {
          if (!this.switcherLoaded || !this.dirty.serial) return serverSerial;
          const fields = ['port', 'baud', 'slave_addr', 'parity', 'bytesize', 'stopbits'];
          const serverMatches = fields.every(field =>
            serverSerial[field] === this.switcher.serial[field]
          );
          if (serverMatches) {
            this.dirty.serial = false;
            return serverSerial;
          }
          return this.switcher.serial;
        },

        normalizeActions(actions) {
          return this.inputIndexes.map(input => {
            const row = actions?.[input] ?? [];
            return this.eventIndexes.map(event => ({
              action: Number(row?.[event]?.action ?? 0),
              channel: Number(row?.[event]?.channel ?? 0),
              param: Number(row?.[event]?.param ?? 0),
            }));
          });
        },

        normalizeZcd(zcd) {
          const delays = this.relayIndexes.map(relay => Number(zcd?.delays?.[relay] ?? -1));
          const pending = this.relayIndexes.map(relay => Number(zcd?.pending?.[relay] ?? 0));
          return {
            enabled: Boolean(zcd?.enabled),
            delays,
            pending,
            edge_count: Number(zcd?.edge_count ?? 0),
            edge_age_ms: Number(zcd?.edge_age_ms ?? 65535),
            fallback_count: Number(zcd?.fallback_count ?? 0),
          };
        },

        mergeZcdRefresh(serverZcd) {
          const activeDraft = this.zcdPendingConfig || (this.zcdDirty ? {
            enabled: Boolean(this.switcher.zcd.enabled),
            delays: this.relayIndexes.map(relay => Number(this.switcher.zcd.delays?.[relay] ?? -1)),
          } : null);

          if (!activeDraft) return serverZcd;

          const serverMatchesDraft =
            Boolean(serverZcd.enabled) === Boolean(activeDraft.enabled) &&
            this.relayIndexes.every(relay => Number(serverZcd.delays?.[relay] ?? -1) === Number(activeDraft.delays?.[relay] ?? -1));

          if (serverMatchesDraft) {
            this.zcdPendingConfig = null;
            if (!this.zcdDirty) return serverZcd;
          }

          return {
            ...serverZcd,
            enabled: Boolean(activeDraft.enabled),
            delays: [...activeDraft.delays],
          };
        },

        channelStatusLabel(channel) {
          if (Number(channel.type) === 2) {
            const motion = Number(channel.motion || 0);
            if (motion === 1) return 'Opening';
            if (motion === 2) return 'Closing';
            return `${Math.round(Number(channel.status || 0) / 100)}%`;
          }
          return channel.status ? 'On' : 'Off';
        },

        channelTypeLabel(channel) {
          const type = Number(channel.type);
          if (type === 1) return 'Light';
          if (type === 2) return 'Blind';
          return 'Unused';
        },

        selectedChannelData() {
          return this.switcher.channels.find(channel => channel.ch === this.selectedChannel)
            || this.switcher.channels[0]
            || null;
        },

        eventDescription(event) {
          return [
            'Runs immediately when the contact closes.',
            'Runs whenever the contact opens.',
            'Runs after a quick press and release.',
            'Runs after the button is held down.',
          ][event] || '';
        },

        actionNeedsChannel(action) {
          return Number(action) !== 0;
        },

        actionPositionPercent(input, event) {
          const value = Number(this.switcher.actions[input][event].param || 0);
          return Math.round(value / 100);
        },

        setActionPositionPercent(input, event, value) {
          const percent = Math.max(0, Math.min(100, Number(value || 0)));
          this.switcher.actions[input][event].param = Math.round(percent * 100);
          this.markActionDirty(input, event);
        },

        relaySelected(channel, relay) {
          return Boolean(Number(channel.relay_mask || 0) & (1 << relay));
        },

        markChannelDirty(ch) {
          this.dirty.channels[ch] = true;
        },

        markChannelNameDirty(ch) {
          this.dirty.channelNames[ch] = true;
        },

        markActionDirty(input, event) {
          this.dirty.actions[`${input}:${event}`] = true;
        },

        markInputNameDirty(input) {
          this.dirty.inputNames[input] = true;
        },

        markDebounceDirty(input) {
          this.dirty.debounce[input] = true;
        },

        markSerialDirty() {
          this.dirty.serial = true;
        },

        markPositionDirty(deviceId) {
          this.positionDirty[deviceId] = true;
        },

        setRelaySelected(channel, relay, selected) {
          this.markChannelDirty(channel.ch);
          const bit = 1 << relay;
          const current = Number(channel.relay_mask || 0);
          channel.relay_mask = selected ? (current | bit) : (current & ~bit);
        },

        async saveChannelName(channel) {
          try {
            await this.apiPut(`/api/names/channel/${channel.ch}`, { name: channel.name });
            this.dirty.channelNames[channel.ch] = false;
            this.toast('Channel name saved');
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async saveChannelConfig(channel) {
          try {
            await Promise.all([
              this.apiPut(`/api/names/channel/${channel.ch}`, { name: channel.name }),
              this.apiPut(`/api/channels/${channel.ch}/config`, {
                type: Number(channel.type),
                relay_mask: Number(channel.relay_mask || 0),
                relay_a: Number(channel.relay_a || 0),
                relay_b: Number(channel.relay_b || 0),
                travel_ms_open: Number(channel.travel_ms_open || 0),
                travel_ms_close: Number(channel.travel_ms_close || 0),
                light_off_delay_s: Number(channel.light_off_delay_s || 0),
                light_default_on: Boolean(channel.light_default_on),
              }),
            ]);
            this.dirty.channelNames[channel.ch] = false;
            this.toast(`Channel ${channel.ch + 1} queued for application`);
            await this.refreshSwitcher(true);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async channelCommand(channel, cmd) {
          try {
            await this.apiPost(`/api/channels/${channel.ch}/cmd`, { cmd });
            this.toast('Command queued');
            setTimeout(() => this.refreshSwitcher(true), 400);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async saveInputName(input) {
          try {
            await this.apiPut(`/api/names/input/${input}`, { name: this.switcher.inputNames[input] });
            this.dirty.inputNames[input] = false;
            this.toast('Input name saved');
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async saveDebounce(input) {
          try {
            await this.apiPut(`/api/debounce/${input}`, { ms: Number(this.switcher.debounce[input] || 0) });
            this.toast('Debounce saved');
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        zcdRelayEnabled(relay) {
          return Number(this.switcher.zcd.delays?.[relay] ?? -1) >= 0;
        },

        markZcdDirty() {
          this.zcdDirty = true;
          this.zcdPendingConfig = null;
        },

        setZcdRelayEnabled(relay, enabled) {
          this.markZcdDirty();
          const delays = [...(this.switcher.zcd.delays ?? [])];
          delays[relay] = enabled ? Math.max(0, Number(delays[relay] ?? 0)) : -1;
          this.switcher.zcd = { ...this.switcher.zcd, delays };
        },

        zcdRelayDelay(relay) {
          return this.zcdRelayEnabled(relay) ? Number(this.switcher.zcd.delays?.[relay] ?? 0) : '';
        },

        setZcdRelayDelay(relay, value) {
          this.markZcdDirty();
          const delays = [...(this.switcher.zcd.delays ?? [])];
          delays[relay] = Math.max(0, Math.min(32767, Number(value || 0)));
          this.switcher.zcd = { ...this.switcher.zcd, delays };
        },

        zcdAgeLabel() {
          const age = Number(this.switcher.zcd.edge_age_ms ?? 65535);
          return age >= 65535 ? '-' : `${age} ms`;
        },

        async saveZcd() {
          try {
            const delays = this.relayIndexes.map(relay => {
              if (!this.zcdRelayEnabled(relay)) return -1;
              return Math.max(0, Math.min(32767, Number(this.switcher.zcd.delays[relay] || 0)));
            });
            await this.apiPut('/api/zcd', {
              enabled: Boolean(this.switcher.zcd.enabled),
              delays,
            });
            this.zcdDirty = false;
            this.zcdPendingConfig = {
              enabled: Boolean(this.switcher.zcd.enabled),
              delays,
            };
            this.switcher.zcd = { ...this.switcher.zcd, delays };
            this.toast('ZCD configuration applied');
            await this.refreshSwitcher(true);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async saveAction(input, event) {
          try {
            const row = this.switcher.actions[input][event];
            await this.apiPut(`/api/actions/${input}/${event}`, {
              action: Number(row.action || 0),
              channel: Number(row.channel || 0),
              param: Number(row.param || 0),
            });
            this.toast('Action saved');
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async saveInputConfiguration(input) {
          try {
            const requests = [
              this.apiPut(`/api/names/input/${input}`, {
                name: this.switcher.inputNames[input],
              }),
              this.apiPut(`/api/debounce/${input}`, {
                ms: Number(this.switcher.debounce[input] || 0),
              }),
              ...this.eventIndexes.map(event => {
                const row = this.switcher.actions[input][event];
                return this.apiPut(`/api/actions/${input}/${event}`, {
                  action: Number(row.action || 0),
                  channel: Number(row.channel || 0),
                  param: Number(row.param || 0),
                });
              }),
            ];
            await Promise.all(requests);
            this.dirty.inputNames[input] = false;
            this.toast(`Input ${input + 1} queued for application`);
            await this.refreshSwitcher(true);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async discardSwitcherDrafts() {
          if (!window.confirm('Discard all edits currently shown in the Switcher2 forms?')) return;
          this.dirty = {
            channels: {},
            channelNames: {},
            actions: {},
            inputNames: {},
            debounce: {},
            serial: false,
          };
          this.zcdDirty = false;
          this.zcdPendingConfig = null;
          await this.refreshSwitcher();
          this.toast('Edits discarded');
        },

        async configCommand(path, message, confirmAction = false) {
          if (confirmAction && !window.confirm(message + '?')) return;
          try {
            await this.apiPost(path, {});
            if (path === '/api/config/discard' || path === '/api/config/reset') {
              this.dirty.channels = {};
              this.dirty.actions = {};
              this.dirty.debounce = {};
              this.zcdDirty = false;
              this.zcdPendingConfig = null;
            }
            this.toast(message);
            setTimeout(() => this.refreshSwitcher(true), 600);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async saveSerial() {
          try {
            await this.apiPost('/api/serial', this.switcher.serial);
            this.toast('Serial reconnection queued');
            await this.refreshSwitcher(true);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        serialConfigLabel() {
          const s = this.switcher.serial || {};
          return `${s.port ?? ''} ${s.baud ?? ''} ${s.bytesize ?? 8}${s.parity ?? 'E'}${s.stopbits ?? 1} slave ${s.slave_addr ?? '?'}`;
        },

        async rebootSwitcher() {
          if (!window.confirm('Reboot relay board?')) return;
          try {
            await this.apiPost('/api/reboot', {});
            this.toast('Reboot command sent');
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async flashOta(trial) {
          if (!this.switcher.otaFile) {
            this.toast('Choose a firmware file first', 'error');
            return;
          }
          try {
            const form = new FormData();
            form.append('firmware', this.switcher.otaFile);
            const response = await fetch(`/api/ota/flash?trial=${trial ? 'true' : 'false'}`, {
              method: 'POST',
              body: form,
            });
            const text = await response.text();
            const data = text ? JSON.parse(text) : {};
            if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
            this.toast('OTA flash started');
            setTimeout(() => this.refreshSwitcher(true), 500);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async refreshRolettini(device, silent = false) {
          try {
            const data = await this.apiGet(`/api/devices/${encodeURIComponent(device.id)}/rolettini`);
            this.rolettini = { ...this.rolettini, [device.id]: data };
            device.available = data.available;
            const serverPosition = data.status?.position;
            if (this.positionPending[device.id] !== undefined && Number(serverPosition) === Number(this.positionPending[device.id])) {
              delete this.positionPending[device.id];
            }
            if (!this.positionDirty[device.id] && this.positionPending[device.id] === undefined) {
              this.positionDraft[device.id] = data.status?.position ?? this.positionDraft[device.id] ?? 0;
            }
            if (!this.configDraft[device.id]) {
              const draft = {};
              for (const field of data.config ?? []) draft[field.symbol] = field.value;
              this.configDraft = { ...this.configDraft, [device.id]: draft };
            }
          } catch (error) {
            this.rolettini = { ...this.rolettini, [device.id]: { error: error.message || String(error) } };
            device.available = false;
            if (!silent) this.toast(error.message || String(error), 'error');
          }
        },

        formatReading(reading) {
          if (reading.value === null || reading.value === undefined) return '-';
          const decimals = Number.isInteger(reading.accuracy_decimals) ? reading.accuracy_decimals : 2;
          const value = Number(reading.value);
          if (!Number.isFinite(value)) return String(reading.value);
          return value.toFixed(decimals);
        },

        inputStep(field) {
          if (field.scale && field.scale !== 1) return field.scale;
          return 1;
        },

        formatField(field) {
          if (!field) return '-';
          if (field.value === null || field.value === undefined) return '-';
          if (typeof field.value === 'boolean') return field.value ? 'Yes' : 'No';
          if (typeof field.value === 'number') {
            const decimals = Number.isInteger(field.accuracy_decimals) ? field.accuracy_decimals : 0;
            return `${field.value.toFixed(decimals)}${field.unit ? ' ' + field.unit : ''}`;
          }
          return `${field.value}${field.unit ? ' ' + field.unit : ''}`;
        },

        valueWithUnit(value, unit) {
          if (value === null || value === undefined) return '-';
          const number = Number(value);
          if (Number.isFinite(number)) return `${number}${unit ? ' ' + unit : ''}`;
          return `${value}${unit ? ' ' + unit : ''}`;
        },

        diagnosticFields(snapshot) {
          const hidden = new Set(['fw_version_major', 'fw_version_minor', 'fw_version_patch']);
          return (snapshot?.diagnostics ?? []).filter(field => !hidden.has(field.symbol));
        },

        async saveRolettiniConfig(device) {
          try {
            await this.apiPut(`/api/devices/${encodeURIComponent(device.id)}/rolettini/config`, {
              fields: this.configDraft[device.id] ?? {},
            });
            this.toast('Configuration applied');
            await this.refreshRolettini(device, true);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async rolettiniCommand(device, action, value = null, confirmAction = false) {
          if (confirmAction && !window.confirm(`Run ${action.replaceAll('_', ' ')} on ${device.name}?`)) return;
          try {
            await this.apiPost(`/api/devices/${encodeURIComponent(device.id)}/rolettini/command`, { action, value });
            if (action === 'set_position') {
              this.positionDirty[device.id] = false;
              this.positionPending[device.id] = value;
            }
            this.toast('Command queued');
            setTimeout(() => this.refreshRolettini(device, true), 500);
          } catch (error) {
            this.toast(error.message || String(error), 'error');
          }
        },

        async apiGet(path) {
          const response = await fetch(path);
          const text = await response.text();
          let data = {};
          try {
            data = text ? JSON.parse(text) : {};
          } catch (_) {
            throw new Error(`Invalid response from ${path}`);
          }
          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}`);
          }
          return data;
        },

        async apiPut(path, payload) {
          return this.apiSend(path, 'PUT', payload);
        },

        async apiPost(path, payload) {
          return this.apiSend(path, 'POST', payload);
        },

        async apiSend(path, method, payload) {
          const response = await fetch(path, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload ?? {}),
          });
          const text = await response.text();
          let data = {};
          try {
            data = text ? JSON.parse(text) : {};
          } catch (_) {
            throw new Error(`Invalid response from ${path}`);
          }
          if (!response.ok) {
            throw new Error(data.error || `HTTP ${response.status}`);
          }
          return data;
        },

        toast(message, type = 'info') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, message, type });
          setTimeout(() => {
            this.toasts = this.toasts.filter(toast => toast.id !== id);
          }, 3500);
        },
      };
    }
  </script>
</body>
</html>
